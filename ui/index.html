<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>looop · 项目循环</title><link rel="stylesheet" href="/looop-assets/style.css"></head><body>
<header><a class="brand" href="/looop"><span class="mark">↻</span> looop</a><nav><span class="live" id="connection">正在连接</span><form id="logout" method="post" action="/logout"><button type="submit">退出</button></form></nav></header>
<main><section class="intro"><h1>项目</h1><div class="actions"><button id="execution-settings" disabled type="button">执行器设置</button><button id="onboard" type="button">＋ 接入项目</button><button id="refresh" type="button"><span class="refresh-icon" aria-hidden="true">↻</span>刷新</button></div></section>
<div id="notice" class="notice" role="status" hidden></div><div id="error" role="alert" hidden></div><section class="metrics" aria-label="运行概览"><div><span>项目</span><strong id="count">—</strong></div><div><span>活动任务</span><strong id="active">—</strong></div><div><span>需要处理</span><strong id="needs">—</strong></div><div class="updated"><span>更新于</span><strong id="updated">—</strong></div></section>
<div class="layout"><section><div class="section-title"><h2>工作区</h2><label><input type="checkbox" id="tests"> 显示验证项目</label></div><div id="projects" aria-live="polite"><div class="empty">正在读取项目当前状态…</div></div></section><aside><section class="panel"><h2>待处理</h2><div id="attention"></div></section><section class="panel"><h2>执行路线</h2><div id="providers"></div><p class="muted small">订阅剩余额度未知。</p></section></aside></div>
<footer><span>looop</span><span>每 20 秒更新</span></footer></main><dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" type="button" aria-label="关闭">关闭</button></div><div id="dialog-body"></div></dialog><script type="module" src="/looop-assets/app.js?v=p1f"></script></body></html>
